<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">

<title>漫画プロンプトビルダー for Gemini v2.1 Stable</title>

<link rel="manifest" href="manifest.json?v=2.1">

<meta name="theme-color" content="#4a90e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

*, *::before, *::after {
    box-sizing: border-box;
}

:root {
    --bg-color: #1e1e1e;
    --container-bg: #2d2d2d;
    --accent-color: #4a90e2;
    --accent-active: #00ff66;
    --text-color: #f0f0f0;
    --border-color: #444444;

    --font-family:
        "HG丸ゴシックM-PRO",
        "HG Maru Gothic M-PRO",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

    --font-size: 13pt;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-family);
    font-size: var(--font-size);

    margin: 0;
    padding: 12px;

    overflow-x: hidden;

    -webkit-tap-highlight-color: transparent;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;

    background-color: var(--container-bg);

    padding: 16px;

    border-radius: 12px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    color: var(--accent-color);
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
}

fieldset {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 15px;
    margin-bottom: 16px;
}

legend {
    color: var(--accent-color);
    font-weight: bold;
}

.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
}

label {
    margin-bottom: 6px;
    font-weight: bold;
}

textarea,
select,
input[type="text"] {

    width: 100%;
    background-color: #383838;
    color: var(--text-color);

    border: 1px solid var(--border-color);
    border-radius: 6px;

    padding: 12px;

    font-size: 1rem;

    font-family: var(--font-family);

    outline: none;
}

textarea {
    resize: vertical;
}

button {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-family);
    transition: all 0.15s ease;
}

button:active {
    transform: scale(0.98);
}

.main-btn {
    width: 100%;
    background-color: var(--accent-color);
    color: white;
    padding: 15px;
    font-size: 1.1rem;
    font-weight: bold;
}

.sub-btn {
    background-color: #555;
    color: white;
    padding: 10px;
}

.danger-btn {
    background-color: #962d2d;
}

.management-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
    background-color: #222;
    border-radius: 8px;
    padding: 12px;
}

.management-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.tag-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.tag-btn {
    background-color: #444;
    color: white;
    border: 1px solid var(--border-color);
    text-align: left;
    padding: 10px 12px;
}

.tag-btn.active {
    background-color: var(--accent-active);
    color: #000;
    border-color: var(--accent-active);
    font-weight: bold;
}

.color-mode-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.color-btn {
    height: 44px;
    background-color: #444;
    color: white;
    border: 1px solid var(--border-color);
}

.color-btn.active {
    background-color: var(--accent-active);
    color: #000;
    border-color: var(--accent-active);
    font-weight: bold;
}

details {
    margin-top: 12px;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
}

summary {
    cursor: pointer;
    color: #9fd0ff;
    font-weight: bold;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 10px;
}

.modal-box {
    width: 100%;
    max-height: 95vh;
    background-color: var(--container-bg);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
}

.modal-body {
    flex-grow: 1;
    margin-bottom: 12px;
}

.modal-body textarea {
    height: 60vh;
    background-color: #1e1e1e;
    color: #00ff66;
    font-family: Consolas, Monaco, monospace;
}

.modal-footer {
    display: flex;
    gap: 10px;
}

.modal-footer button {
    flex: 1;
}

</style>
</head>

<body>

<div class="container">

<h1>漫画プロンプトビルダー for Gemini</h1>

<div class="management-area">

<div class="form-group">
<label for="historySelect">自動保存データの再利用：</label>
<select id="historySelect">
<option value="">-- 履歴表示 --</option>
</select>
</div>

<div class="management-controls">

<button type="button" class="sub-btn" onclick="loadHistory()">
適用・復元
</button>

<button type="button" class="sub-btn danger-btn" onclick="deleteHistory()">
履歴から消す
</button>

</div>

<div class="form-group">
<label for="characterSelect">👥 キャラクター選択：</label>

<select id="characterSelect">
<option value="">-- キャラクターを選択 --</option>
</select>
</div>

<div class="management-controls">

<button type="button" class="sub-btn" onclick="addSelectedCharacterToTextarea()">
設定欄へ合流
</button>

<button type="button" class="sub-btn danger-btn" onclick="deleteCharacterFromList()">
選択キャラ削除
</button>

</div>

<div class="form-group">
<label for="newCharacterName">新しいキャラクター名：</label>

<input type="text" id="newCharacterName">
</div>

<div class="form-group">
<label for="newCharacterDetails">キャラクター設定：</label>

<textarea id="newCharacterDetails" rows="2"></textarea>
</div>

<button
type="button"
class="sub-btn"
style="background-color:#2b753a;width:100%;"
onclick="addNewCharacter()"
>
✨ キャラを登録
</button>

</div>

<form onsubmit="return false;">

<fieldset>

<legend>★ 世界観・スタイルの設定</legend>

<div class="form-group">

<label for="subject_custom">
キャラクター設定：
</label>

<textarea id="subject_custom" rows="3"></textarea>

</div>

<div class="form-group">

<label for="manga_style">
作画スタイル：
</label>

<select id="manga_style"></select>

</div>

</fieldset>

<fieldset>

<legend>📖 構成・ページの組み立て</legend>

<div class="form-group">

<label for="panel_layout">
コマ数・コマ割り構成：
</label>

<select id="panel_layout"></select>

</div>

<div class="form-group">

<label>出力カラー：</label>

<div class="color-mode-controls">

<button
type="button"
class="color-btn"
id="mode_color"
onclick="selectColorMode('color')"
>
🎨 フルカラー
</button>

<button
type="button"
class="color-btn"
id="mode_mono"
onclick="selectColorMode('mono')"
>
⬛ モノクロ
</button>

</div>

</div>

<details>

<summary>
▼ くわしい設定
</summary>

<div class="form-group">

<label for="additional_notes">
追加オプション：
</label>

<div class="tag-buttons">

<button type="button" class="tag-btn" data-tag=" --ar 2:4" onclick="toggleTagButton(this)">
📱 スマホ画面サイズ指定
</button>

<button type="button" class="tag-btn" data-tag=" --ar 2:3" onclick="toggleTagButton(this)">
📖 週刊誌サイズ指定
</button>

<button type="button" class="tag-btn" data-tag=" --ar 3:2" onclick="toggleTagButton(this)">
💻 よこ長サイズ指定
</button>

<button type="button" class="tag-btn" data-tag=" --niji 6" onclick="toggleTagButton(this)">
✨ アニメ風表現
</button>

<button type="button" class="tag-btn" data-tag=", slanted panel borders, dynamic diagonal layout, dramatic panel compositions" onclick="toggleTagButton(this)">
📐 大迫力のななめコマ
</button>

<button type="button" class="tag-btn" data-tag=", stylized comic book pop-art onomatopoeia, bold English action text SFX" onclick="toggleTagButton(this)">
💥 英語の描き文字
</button>

<button type="button" class="tag-btn" data-tag=", charming child hand-drawn speech bubbles, soft whimsical round dialogue frames" onclick="toggleTagButton(this)">
💬 手書き風フキダシ
</button>

</div>

<textarea id="additional_notes" rows="2"></textarea>

</div>

</details>

<div class="form-group">

<label for="dialogues_text">
セリフや設定：
</label>

<textarea id="dialogues_text" rows="6"></textarea>

</div>

</fieldset>

<button
type="button"
class="main-btn"
onclick="generateGeminiPrompt()"
>
AI専用の指示書を生成する！
</button>

</form>

</div>

<div class="modal-overlay" id="outputModal">

<div class="modal-box">

<div class="modal-body">

<textarea id="outputText" readonly></textarea>

</div>

<div class="modal-footer">

<button
type="button"
class="sub-btn"
style="background-color:#4a90e2;"
onclick="copyToClipboard()"
>
コピー
</button>

<button
type="button"
class="sub-btn"
onclick="closeModal()"
>
閉じる
</button>

</div>

</div>

</div>

<script defer>

function safeParseJSON(raw, fallback = []) {

    try {
        return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
        console.error(e);
        return fallback;
    }
}

function safeLocalStorageGet(key, fallback = []) {

    try {

        return safeParseJSON(
            localStorage.getItem(key),
            fallback
        );

    } catch (e) {

        console.error(e);

        return fallback;
    }
}

function safeLocalStorageSet(key, value) {

    try {

        localStorage.setItem(key, value);

        return true;

    } catch (e) {

        console.error(e);

        alert("保存領域エラー");

        return false;
    }
}

const DATA_STYLE = {

"ゆるキャラ風": {
color:"yuru-chara style, cute mascot, simplified vector",
mono:"yuru-chara monochrome manga style, soft screentones"
},

"線が少ないミニマルイラスト": {
color:"minimalist illustration, simple clean lines, flat design",
mono:"minimal monochrome illustration, clean manga lines"
},

"手描き風スケッチ": {
color:"hand-drawn sketch, pencil line art, casual scribbles, heartwarming",
mono:"hand-drawn monochrome sketch, pencil manga lines"
},

"ふわふわ系マスコット": {
color:"fluffy mascot character, soft shading, adorable, friendly look",
mono:"fluffy mascot monochrome manga style, soft screentones"
},

"絵本風（2Dフラット）": {
color:"storybook illustration, 2D flat art, whimsical design",
mono:"storybook monochrome illustration, soft black ink storybook style"
},

"デフォルメマスコット風": {
color:"chibi mascot style, super deformed character art",
mono:"super deformed monochrome mascot manga style"
},

"現代アニメ風": {
color:"modern anime style, vibrant coloring, clean shading, beautiful details",
mono:"modern anime monochrome manga style, clean ink lines, screentones"
},

"少年漫画風": {
color:"shonen manga style, dynamic composition, energetic and sharp lines",
mono:"shonen manga monochrome style, sharp ink lines, professional screentones"
},

"北斗の拳風": {
color:"80s masculine retro manga style, muscular anatomy, thick ink lines",
mono:"80s monochrome retro manga style, thick ink lines, dramatic screentones"
},

"JOJO風": {
color:"highly stylized manga art, dramatic shading, bold heavy lines",
mono:"JoJo monochrome manga aesthetic, dramatic black ink shadows"
},

"少女漫画風": {
color:"shoujo manga style, delicate lines, expressive emotional eyes",
mono:"shoujo monochrome manga style, delicate black lines"
},

"ベルバラ風": {
color:"classic 70s shoujo manga style, retro anime vintage",
mono:"70s shoujo monochrome manga style, elegant screentones"
},

"ディズニー風": {
color:"classic western 3D animation style, Disney character aesthetic",
mono:"classic western monochrome cartoon style"
},

"サウスパーク風": {
color:"2D cutout animation style, South Park aesthetic",
mono:"minimal monochrome cutout cartoon style"
},

"水彩画風": {
color:"watercolor painting style, soft bleeding ink, pastel translucent tones",
mono:"ink wash painting style, monochrome watercolor texture"
},

"ピクセルアート風": {
color:"8bit pixel art style, retro video game aesthetic",
mono:"8bit monochrome pixel art style"
}

};

const DATA_LAYOUT = {

"4コマ構成（日本の縦並び・おすすめ！）":
"vertical 4-panel comic strip, arranged sequentially from top to bottom in a single column",

"3コマ（ちょっと短め）":
"3-panel comic layout, clean frames",

"5〜7コマ（しっかりストーリー）":
"5 to 7 panels comic page layout",

"大ゴマ ＋ 小コマ（メリハリのある大迫力）":
"dynamic panel layout with one large splash panel and smaller secondary panels"

};

let currentColorMode = "";

window.addEventListener('DOMContentLoaded', () => {

initSelectOptions(
'manga_style',
Object.keys(DATA_STYLE)
);

initSelectOptions(
'panel_layout',
Object.keys(DATA_LAYOUT)
);

document.getElementById('panel_layout').value =
"4コマ構成（日本の縦並び・おすすめ！）";

updateHistoryCombo();
updateCharacterCombo();
syncTagButtonsWithTextarea();

});

function initSelectOptions(id, keys) {

const select =
document.getElementById(id);

keys.forEach(key => {

const opt =
document.createElement('option');

opt.value = key;
opt.textContent = key;

select.appendChild(opt);

});
}

function setColorMode(mode) {

currentColorMode = mode;

document
.getElementById('mode_color')
.classList
.toggle('active', mode === 'color');

document
.getElementById('mode_mono')
.classList
.toggle('active', mode === 'mono');

}

function selectColorMode(mode) {

if (currentColorMode === mode) {
setColorMode("");
} else {
setColorMode(mode);
}
}

function getCharacters() {

return safeLocalStorageGet(
'manga_prompt_characters',
[]
);
}

function saveCharactersList(list) {

safeLocalStorageSet(
'manga_prompt_characters',
JSON.stringify(list)
);

updateCharacterCombo();
}

function updateCharacterCombo() {

const select =
document.getElementById('characterSelect');

select.innerHTML =
'<option value="">-- キャラクターを選択 --</option>';

getCharacters().forEach(c => {

const opt =
document.createElement('option');

opt.value = c.id;
opt.textContent = c.name;

select.appendChild(opt);

});

}

function addNewCharacter() {

const name =
document
.getElementById('newCharacterName')
.value
.trim();

const details =
document
.getElementById('newCharacterDetails')
.value
.trim();

if (!name || !details) {

alert("キャラクター名と設定を入力してください。");

return;
}

const chars = getCharacters();

chars.unshift({

id:
crypto.randomUUID
? crypto.randomUUID()
: String(Date.now()) + Math.random(),

name,
details

});

saveCharactersList(chars);

document.getElementById('newCharacterName').value = "";
document.getElementById('newCharacterDetails').value = "";

alert(`「${name}」を登録しました。`);

}

function addSelectedCharacterToTextarea() {

const id =
document.getElementById('characterSelect').value;

if (!id) return;

const chars = getCharacters();

const target =
chars.find(c => c.id == id);

if (!target) return;

const textarea =
document.getElementById('subject_custom');

if (textarea.value.trim()) {

textarea.value +=
`\n${target.name}（${target.details}）`;

} else {

textarea.value =
`${target.name}（${target.details}）`;

}

}

function deleteCharacterFromList() {

const id =
document.getElementById('characterSelect').value;

if (!id) return;

let chars = getCharacters();

chars =
chars.filter(c => c.id != id);

saveCharactersList(chars);

}

function getHistory() {

return safeLocalStorageGet(
'manga_prompt_history',
[]
);

}

function saveHistoryList(list) {

safeLocalStorageSet(
'manga_prompt_history',
JSON.stringify(list.slice(0, 50))
);

}

function updateHistoryCombo() {

const select =
document.getElementById('historySelect');

select.innerHTML =
'<option value="">-- 履歴表示 --</option>';

getHistory().forEach(h => {

const opt =
document.createElement('option');

opt.value = h.id;
opt.textContent = h.title;

select.appendChild(opt);

});

}

function getCurrentState() {

return {

subject:
document.getElementById('subject_custom').value,

style:
document.getElementById('manga_style').value,

layout:
document.getElementById('panel_layout').value,

notes:
document.getElementById('additional_notes').value,

dialogues:
document.getElementById('dialogues_text').value,

colorMode:
currentColorMode

};

}

function autoSaveHistory(subject) {

const hist = getHistory();

hist.unshift({

id:
crypto.randomUUID
? crypto.randomUUID()
: String(Date.now()) + Math.random(),

title:
new Date().toLocaleString()
+ " - "
+ subject.substring(0, 12),

data: getCurrentState()

});

saveHistoryList(hist);

updateHistoryCombo();

}

function applyStateToUI(d) {

document.getElementById('subject_custom').value =
d.subject || '';

document.getElementById('manga_style').value =
d.style || '';

document.getElementById('panel_layout').value =
d.layout || '';

document.getElementById('additional_notes').value =
d.notes || '';

document.getElementById('dialogues_text').value =
d.dialogues || '';

setColorMode(d.colorMode || "");

}

function loadHistory() {

const id =
document.getElementById('historySelect').value;

if (!id) return;

const hist = getHistory();

const target =
hist.find(h => h.id == id);

if (!target) return;

applyStateToUI(target.data);

}

function deleteHistory() {

const id =
document.getElementById('historySelect').value;

if (!id) return;

let hist = getHistory();

hist =
hist.filter(h => h.id != id);

saveHistoryList(hist);

updateHistoryCombo();

}

function toggleTagButton(btn) {

const textarea =
document.getElementById('additional_notes');

const tag =
btn.getAttribute('data-tag');

if (btn.classList.contains('active')) {

btn.classList.remove('active');

textarea.value =
textarea.value
.split(tag)
.join('');

} else {

btn.classList.add('active');

if (!textarea.value.includes(tag)) {
textarea.value += tag;
}

}

}

function syncTagButtonsWithTextarea() {

const text =
document.getElementById('additional_notes').value;

document
.querySelectorAll('.tag-btn')
.forEach(btn => {

const tag =
btn.getAttribute('data-tag');

btn.classList.toggle(
'active',
text.includes(tag)
);

});

}

document
.getElementById('additional_notes')
?.addEventListener(
'input',
syncTagButtonsWithTextarea
);

function generateGeminiPrompt() {

const subject =
document
.getElementById('subject_custom')
.value
.trim();

if (!subject) {

alert("キャラクター設定を入力してください。");

return;

}

const styleKey =
document.getElementById('manga_style').value;

const styleData =
DATA_STYLE[styleKey];

let style = "";

if (styleData) {

style =
currentColorMode === 'mono'
? styleData.mono
: styleData.color;

}

const layout =
DATA_LAYOUT[
document.getElementById('panel_layout').value
];

const notes =
document.getElementById('additional_notes').value;

const dialogues =
document.getElementById('dialogues_text').value;

let p = "";

p += "[重要：絶対遵守命令]\n\n";

p +=
"あなた自身は絶対に画像を生成しないでください。\n";

p +=
"英語のテキストプロンプトのみを出力してください。\n\n";

p += `Characters: ${subject}\n`;

p += `Style: ${style}\n`;

p += `Layout: ${layout}\n`;

if (dialogues.trim()) {
p += `Dialogues:\n${dialogues}\n`;
}

if (notes.trim()) {
p += `Additional Notes: ${notes}\n`;
}

document.getElementById('outputText').value = p;

openModal();

autoSaveHistory(subject);

}

function openModal() {

document.getElementById('outputModal').style.display =
'flex';

}

function closeModal() {

document.getElementById('outputModal').style.display =
'none';

}

async function copyToClipboard() {

try {

await navigator.clipboard.writeText(
document.getElementById('outputText').value
);

alert("コピーしました。");

} catch (e) {

console.error(e);

alert("コピー失敗");

}

}

if ('serviceWorker' in navigator) {

window.addEventListener('load', async () => {

try {

const res =
await fetch('./sw.js?v=2.1', {
method: 'HEAD'
});

if (!res.ok) return;

await navigator.serviceWorker.register(
'./sw.js?v=2.1'
);

} catch (e) {

console.warn(e);

}

});

}

</script>

</body>
</html>
