<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>まんがプロンプトビルダー for Gemini</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* すべての要素でサイズ計算を枠内（border-box）に統一し、はみ出しを根本から防止 */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* HG丸ゴシックM-PROライクな柔らかな視認性とダークテーマの融合 */
        :root {
            --bg-color: #1e1e1e;
            --container-bg: #2d2d2d;
            --accent-color: #4a90e2; /* 標準の青 */
            --accent-active: #00ff66; /* スイッチONの時のピカッと光る緑 */
            --text-color: #f0f0f0;
            --border-color: #444444;
            --font-family: "HG丸ゴシックM-PRO", "HG Maru Gothic M-PRO", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
            --font-size: 13pt; /* 共通ルールに従い、一貫性を持たせた基準サイズ13pt */
        }

        /* スマホ向けにスクロールバーのバウンスを抑制、タップハイライトをクリア */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.5;
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden; /* 横スクロールの発生を完全に禁止 */
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.35rem;
            margin-top: 5px;
            margin-bottom: 20px;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 16px;
            background-color: rgba(255,255,255,0.02);
            min-width: 0; /* スマホ画面幅に強制フィットさせる最重要指定 */
            width: 100%;
        }

        legend {
            font-weight: bold;
            color: var(--accent-color);
            padding: 0 8px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* スマホの親指でのタップ、入力しやすさを担保する大きめのインプット領域（高さ44px以上） */
        select, textarea {
            background-color: #383838;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-family);
            font-size: 1rem;
            outline: none;
            width: 100%;
            -webkit-appearance: none; /* iOS特有のインプット内グラデーションを抑止 */
            appearance: none;
        }

        select:focus, textarea:focus {
            border-color: var(--accent-color);
            background-color: #404040;
        }

        textarea {
            resize: vertical;
        }

        /* スイッチON/OFFをスマホ幅に最適化した1列の縦並び配置 */
        .tag-buttons {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        
        .tag-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.88rem; /* 13ptベースからボタン幅に合わせて綺麗に収まる微調整 */
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
            white-space: nowrap; /* ボタン内の文字の自動折り返しを禁止し、1行でスッキリ表示 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* スイッチがON（アクティブ）になったときの鮮やかなスタイル */
        .tag-btn.active {
            background-color: #1b4d3e;
            color: var(--accent-active);
            border-color: var(--accent-active);
            font-weight: bold;
        }

        /* 管理・保存エリアのコンテナー */
        .management-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            background-color: #222;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
        }

        .management-block {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .management-block:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* 画像「1000022352.png」の崩れを解消するため、4列・3列の無理な配置から、美しい「2列（2カラム）のグリッド構造」へ刷新 */
        .management-controls {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 均等に2分割 */
            gap: 8px;
            width: 100%;
            margin-top: 6px;
        }
        
        .management-controls button {
            width: 100%;
            height: 44px; /* タップしやすい標準高さを確保 */
            padding: 4px 8px;
            font-size: 0.85rem; /* 13pt基準の視認性を保ちつつ、2列に美しく収まるサイズ */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: var(--font-family);
            white-space: nowrap; /* 不自然な途中改行を完全に防止 */
        }

        /* アクションボタン（最下部の生成ボタンを大きく押しやすく） */
        .actions {
            margin-top: 20px;
            width: 100%;
        }

        button.main-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-family);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button.main-btn:active {
            filter: brightness(0.8);
        }

        button.sub-btn {
            background-color: #555;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button.sub-btn:active {
            background-color: #666;
        }
        button.danger-btn {
            background-color: #962d2d;
        }
        button.danger-btn:active {
            background-color: #b33636;
        }

        /* 出力モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 10px;
        }
        .modal-box {
            background-color: var(--container-bg);
            width: 100%;
            max-height: 95vh;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .modal-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }
        .modal-body {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            width: 100%;
        }
        .modal-body textarea {
            width: 100%;
            height: 60vh;
            background-color: #1e1e1e;
            color: #00ff66;
            font-family: Consolas, Monaco, var(--font-family);
            font-size: 0.9rem;
            padding: 10px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .modal-footer button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>まんがプロンプトビルダー for Gemini</h1>

    <!-- 保存と管理エリア（グリッド2列配置へ最適化し、不自然な改行を完全追放） -->
    <div class="management-area">
        <!-- 1. じどう保存のブロック -->
        <div class="management-block">
            <div class="form-group" style="margin-bottom: 4px;">
                <label for="historySelect">じどう保存された れきし:</label>
                <select id="historySelect">
                    <option value="">-- もどしたい時につかう --</option>
                </select>
            </div>
            <div class="management-controls">
                <button type="button" class="sub-btn" onclick="loadHistory()">もどす</button>
                <button type="button" class="sub-btn" onclick="renameHistory()">名前の変更</button>
                <button type="button" class="sub-btn danger-btn" onclick="deleteHistory()">けす</button>
                <button type="button" class="sub-btn danger-btn" style="background-color: #6e1e1e;" onclick="clearAllHistory()">れきしを一括削除</button>
            </div>
        </div>

        <!-- 2. ★お気に入り固定保存のブロック -->
        <div class="management-block" style="padding-top: 6px;">
            <div class="form-group" style="margin-bottom: 4px;">
                <label for="favoriteSelect">★ お気に入り固定保存（ずっと残るよ）:</label>
                <select id="favoriteSelect">
                    <option value="">-- お気に入りを選ぶ --</option>
                </select>
            </div>
            <div class="management-controls">
                <button type="button" class="sub-btn" style="background-color: #c49a45; color: #fff;" onclick="saveToFavorites()">お気に入りに保存</button>
                <button type="button" class="sub-btn" onclick="loadFavorite()">よびだす</button>
                <button type="button" class="sub-btn danger-btn" onclick="deleteFavorite()">お気に入りをけす</button>
            </div>
        </div>
    </div>

    <form id="promptForm" onsubmit="return false;">
        <fieldset>
            <legend>★ まんがの基本設定（どんな世界にする？）</legend>
            
            <div class="form-group">
                <label for="subject_custom">まんがの主人公や登場人物（だれが でてくる？）：</label>
                <textarea id="subject_custom" rows="3" placeholder="例：&#10;シズク（ジト目で大人しいダウナー系の少女）&#10;ビルダーくん（アプリの妖精。優しく教えてくれるマスコット）" required></textarea>
            </div>

            <div class="form-group">
                <label for="manga_style">絵のスタイル（タッチ）：</label>
                <select id="manga_style"></select>
            </div>
        </fieldset>

        <fieldset>
            <legend>📖 ページの組み立て</legend>

            <div class="form-group">
                <label for="panel_layout">コマの数・ならび方：</label>
                <select id="panel_layout"></select>
            </div>

            <div class="form-group">
                <label for="additional_notes">もっとこだわりたいこと（追加のめいれい）：</label>
                <!-- スイッチ式ON/OFFボタン。文字の自動ちぎれ・折り返しをCSSで完全に防止済み -->
                <div class="tag-buttons">
                    <button type="button" class="tag-btn" id="btn_ar24" data-tag=" --ar 2:4" onclick="toggleTagButton(this)">📱 スマホ画面サイズにする [--ar 2:4]</button>
                    <button type="button" class="tag-btn" id="btn_ar23" data-tag=" --ar 2:3" onclick="toggleTagButton(this)">📖 週刊誌サイズにする [--ar 2:3]</button>
                    <button type="button" class="tag-btn" id="btn_ar32" data-tag=" --ar 3:2" onclick="toggleTagButton(this)">💻 よこ長画面サイズにする [--ar 3:2]</button>
                    <button type="button" class="tag-btn" id="btn_niji6" data-tag=" --niji 6" onclick="toggleTagButton(this)">✨ アニメっぽくする [--niji 6]</button>
                    <button type="button" class="tag-btn" id="btn_slanted" data-tag=", slanted panel borders, dynamic diagonal layout, dramatic panel compositions" onclick="toggleTagButton(this)">📐 大迫力のななめコマにする (Slanted Borders)</button>
                    <button type="button" class="tag-btn" id="btn_popsfx" data-tag=", stylized comic book pop-art onomatopoeia, bold English action text SFX" onclick="toggleTagButton(this)">💥 英語のドカーン文字を入れる (POP SFX)</button>
                    <button type="button" class="tag-btn" id="btn_bubbles" data-tag=", charming child hand-drawn speech bubbles, soft whimsical round dialogue frames" onclick="toggleTagButton(this)">💬 手書きの丸いフキダシにする (Hand-drawn Bubbles)</button>
                </div>
                <textarea id="additional_notes" rows="2" placeholder="特別なカメラの角度や、かきこみたいことがあれば自由に入力してね。"></textarea>
            </div>

            <div class="form-group">
                <label for="dialogues_text">セリフ・キャラクターの言葉（改行してね）：</label>
                <textarea id="dialogues_text" rows="6" placeholder="「よしっ、いくぞ！」&#10;「うわっ！前がみえないぞ！？」&#10;「なんとかなるさ！」&#10;「大せいこう！」"></textarea>
            </div>
        </fieldset>

        <div class="actions">
            <button type="button" class="main-btn" onclick="generateGeminiPrompt()">AI用の指示書（プロンプト）をつくる！</button>
        </div>
    </form>
</div>

<div class="modal-overlay" id="outputModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">できたよ！AIにわたす指示書</div>
            <button type="button" class="sub-btn" style="padding: 6px 12px;" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <textarea id="outputText" readonly></textarea>
        </div>
        <div class="modal-footer">
            <button type="button" class="sub-btn" style="background-color: var(--accent-color);" onclick="copyToClipboard()">コピーする</button>
            <button type="button" class="sub-btn" onclick="closeModal()">とじる</button>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------
    // 16種類の絵柄定義
    // --------------------------------------------------------
    const DATA_STYLE = {
        "ゆるキャラ風": "yuru-chara style, cute mascot, simplified vector",
        "線が少ないミニマルイラスト": "minimalist illustration, simple clean lines, flat design",
        "手描き風スケッチ": "hand-drawn sketch, pencil line art, casual scribbles, heartwarming",
        "ふわふわ系マスコット": "fluffy mascot character, soft shading, adorable, friendly look",
        "絵本風（2Dフラット）": "storybook illustration, 2D flat art, whimsical design",
        "デフォルメマスコット風": "chibi mascot style, super deformed character art",
        "現代アニメ風": "modern anime style, vibrant coloring, clean shading, beautiful details",
        "少年漫画風": "shonen manga style, dynamic composition, energetic and sharp lines",
        "北斗の拳風": "80s masculine retro manga style, muscular anatomy, thick ink lines, Hokuto no Ken aesthetic",
        "JOJO風": "highly stylized manga art, dramatic shading, bold heavy lines, JoJo aesthetic",
        "少女漫画風": "shoujo manga style, delicate lines, expressive emotional eyes",
        "ベルバラ風": "classic 70s shoujo manga style, retro anime vintage, dramatic eyes, roses aesthetic",
        "ディズニー風": "classic western 3D animation style, Disney character aesthetic",
        "サウスパーク風": "2D cutout animation style, South Park aesthetic, minimalist geometric papercraft",
        "水彩画風": "watercolor painting style, soft bleeding ink, pastel translucent tones",
        "ピクセルアート風": "8bit pixel art style, retro video game aesthetic"
    };

    const DATA_LAYOUT = {
        "4コマ構成（日本の縦並び・おすすめ！）": "vertical 4-panel comic strip, arranged sequentially from top to bottom in a single column",
        "3コマ（ちょっと短め）": "3-panel comic layout, clean frames",
        "5〜7コマ（しっかりストーリー）": "5 to 7 panels comic page layout",
        "大ゴマ ＋ 小コマ（メリハリのある大迫力）": "dynamic panel layout with one large splash panel and smaller secondary panels"
    };

    // UI初期構築
    window.addEventListener('DOMContentLoaded', () => {
        initSelectOptions('manga_style', Object.keys(DATA_STYLE));
        initSelectOptions('panel_layout', Object.keys(DATA_LAYOUT));
        
        document.getElementById('panel_layout').value = "4コマ構成（日本の縦並び・おすすめ！）";

        updateHistoryCombo();
        updateFavoriteCombo();
        syncTagButtonsWithTextarea();
    });

    function initSelectOptions(elementId, keys) {
        const select = document.getElementById(elementId);
        keys.forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            select.appendChild(opt);
        });
    }

    // --------------------------------------------------------
    // スイッチON/OFF式タグボタン制御（画面のガタつき移動・スクロールを完全治療）
    // --------------------------------------------------------
    function toggleTagButton(btn) {
        const textarea = document.getElementById('additional_notes');
        const tagText = btn.getAttribute('data-tag');
        
        if (btn.classList.contains('active')) {
            // OFFにする
            btn.classList.remove('active');
            let currentText = textarea.value;
            currentText = currentText.replace(tagText, '');
            textarea.value = currentText;
        } else {
            // ONにする
            btn.classList.add('active');
            if (!textarea.value.includes(tagText)) {
                textarea.value += tagText;
            }
        }
        // 【最重要修正】画面が勝手に下のテキストエリアへスクロール移動するのを防ぐため、以前あった textarea.focus(); を完全に削除しました。
        // これにより、タップした瞬間に画面位置がピタッと固定されたまま、快適にON/OFF連打が可能です。
    }

    function syncTagButtonsWithTextarea() {
        const textarea = document.getElementById('additional_notes');
        const text = textarea.value;
        
        document.querySelectorAll('.tag-buttons .tag-btn').forEach(btn => {
            const tagText = btn.getAttribute('data-tag');
            if (text.includes(tagText)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    document.getElementById('additional_notes')?.addEventListener('input', () => {
        syncTagButtonsWithTextarea();
    });

    // --------------------------------------------------------
    // Gemini用指示書 プロンプト生成コアロジック
    // --------------------------------------------------------
    function generateGeminiPrompt() {
        const subject = document.getElementById('subject_custom').value.trim();
        if (!subject) {
            alert("まんがの主人公や登場人物を入力してね！");
            return;
        }

        const styleKey = document.getElementById('manga_style').value;
        const style = DATA_STYLE[styleKey] || styleKey;

        const layoutKey = document.getElementById('panel_layout').value;
        const layout = DATA_LAYOUT[layoutKey] || layoutKey;

        const notes = document.getElementById('additional_notes').value;
        let dialogues = document.getElementById('dialogues_text').value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        let p = "[重要：絶対遵守命令]\n";
        p += "あなた自身は絶対に画像を生成・出力しないでください。私は画像生成ツール（Imagen等）の入力欄にそのまま貼り付けるための『英語のテキストプロンプト（文字）』だけを求めています。出力は必ずテキスト、あるいはマークダウンのコードブロック形式（```）を用い、文字データのみで返答してください。画像を生成することは厳禁とします。\n\n";
        
        p += "あなたはプロの漫画原作者であり、画像生成AIの高度なプロンプトエンジニアです。\n";
        p += "入力された【登場人物の設定】と【セリフ】の整合性を深く読み解き、最適な『全体のふんいいき』『配色』『キャラクターのオーラ・内面演出』を行間に合わせて自動で推測・補完して、最高品質の指示書を組み立ててください。\n\n";
        
        p += "【必須要件・コマ割りのルール】\n";
        p += "1. 各ページ内のコマ配置や構図は、読者の視線が「右から左、上から下へ」自然に誘導されるように設計すること。\n";
        p += "2. 各ページのコマの大きさがすべて均等・同一にならないよう、重要度や演出に合わせてコマの大きさにしっかりとメリハリ（大ゴマ・小コマ等の変化）をつけること。(※ただし4コマ構成が指定されているページは除く)\n\n";
        
        p += "【出力に関する絶対制約】\n";
        p += "作成した英語プロンプトは、各コマごとにバラバラに分離して分割出力することを厳禁とします。ユーザーが1クリックで画像生成AIへそのまままとめて投入できるよう、必ず「ページ全体の指示を1つに統合した、一括でコピー可能な状態の英語プロンプト」として1つにまとめて完成させて出力してください。\n\n";

        p += "【全ページ共通設定 (キャラクター・世界観の一貫性保証)】\n";
        p += `・登場人物・主人公設定: ${subject}\n`;
        p += `・全体画風（スタイル）: ${style}\n\n`;
        p += "※上記特徴（服装、髪型、色彩、顔の傾向など）は、プロンプト内でブレずに共通してシームレスに描写されるように英文プロンプトを固定・調整してください。\n\n";

        p += "--------------------------------------------------------\n";
        p += "【各ページの個別構成データ】\n";
        p += "--------------------------------------------------------\n";
        p += "■ 第 1 ページ目\n";
        p += `  ・コマ構成指定: ${layout}\n`;
        
        if (dialogues.trim()) {
            p += "  ・組み込んでほしいセリフ・会話（※日本語のままで処理すること）:\n";
            p += "    [重要] 以下のセリフはキャラクターの口調や方言、語気のニュアンスを完璧に保持するため、絶対に英語に翻訳しないでください。生成される英語プロンプト内の吹き出し指定（speech bubble内の指定テキストなど）には、以下の日本語表現をそのままの表記で正確に配置させてください。\n";
            p += `    ${dialogues}\n`;
        }
        
        if (notes.trim()) {
            p += `  ・このページの個別補足指示（画面サイズ・アスペクト比など）: ${notes}\n`;
        }
        p += "\n";
        
        p += "[最終確認]\n";
        p += "繰り返します。画像の出力は完全に不要です。一括コピー可能な状態の『英語テキストプロンプト（文字列）』のみをコードブロック形式（```）で出力してください。";

        document.getElementById('outputText').value = p;
        openModal();

        autoSaveHistory(subject);
    }

    // --------------------------------------------------------
    // 1. じどう保存履歴管理
    // --------------------------------------------------------
    function getHistory() {
        const hist = localStorage.getItem('manga_prompt_history');
        return hist ? JSON.parse(hist) : [];
    }

    function saveHistoryList(list) {
        localStorage.setItem('manga_prompt_history', JSON.stringify(list.slice(0, 50)));
    }

    function autoSaveHistory(subjectStr) {
        const currentData = getCurrentState();
        let hist = getHistory();

        if (hist.length > 0 && JSON.stringify(hist[0].data) === JSON.stringify(currentData)) {
            return;
        }

        const now = new Date();
        const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        let displaySubject = subjectStr.length > 12 ? subjectStr.replace(/\n/g, ' ').substring(0, 12) + "..." : subjectStr.replace(/\n/g, ' ');
        const title = `${timestamp} - ${displaySubject}`;

        hist.unshift({ id: Date.now(), title: title, data: currentData });
        saveHistoryList(hist);
        updateHistoryCombo();
    }

    function getCurrentState() {
        return {
            subject: document.getElementById('subject_custom').value,
            style: document.getElementById('manga_style').value,
            layout: document.getElementById('panel_layout').value,
            notes: document.getElementById('additional_notes').value,
            dialogues: document.getElementById('dialogues_text').value
        };
    }

    function updateHistoryCombo() {
        const select = document.getElementById('historySelect');
        select.innerHTML = '<option value="">-- もどしたい時につかう --</option>';
        
        const hist = getHistory();
        hist.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h.id;
            opt.textContent = h.title;
            select.appendChild(opt);
        });
    }

    function loadHistory() {
        const id = document.getElementById('historySelect').value;
        if (!id) return;

        const hist = getHistory();
        const target = hist.find(h => h.id == id);
        if (!target) return;

        applyStateToUI(target.data);
        alert("前のデータにもどしたよ！");
    }

    function renameHistory() {
        const id = document.getElementById('historySelect').value;
        if (!id) return;

        let hist = getHistory();
        const targetIndex = hist.findIndex(h => h.id == id);
        if (targetIndex === -1) return;

        const newTitle = prompt("新しい名前にかえてね:", hist[targetIndex].title);
        if (newTitle && newTitle.trim()) {
            hist[targetIndex].title = newTitle.trim();
            saveHistoryList(hist);
            updateHistoryCombo();
            document.getElementById('historySelect').value = id;
        }
    }

    function deleteHistory() {
        const id = document.getElementById('historySelect').value;
        if (!id) return;

        if (confirm("えらんだ れきし を消してもいい？")) {
            let hist = getHistory();
            hist = hist.filter(h => h.id != id);
            saveHistoryList(hist);
            updateHistoryCombo();
        }
    }

    function clearAllHistory() {
        if (confirm("【ご注意】じどう保存された「れきし」をぜんぶ消してもいい？\n（★お気に入りは消えません）")) {
            localStorage.removeItem('manga_prompt_history');
            updateHistoryCombo();
            alert("れきしをすべてクリアしたよ！");
        }
    }

    // --------------------------------------------------------
    // 2. ★お気に入り固定保存の管理システム
    // --------------------------------------------------------
    function getFavorites() {
        const favs = localStorage.getItem('manga_prompt_favorites');
        return favs ? JSON.parse(favs) : [];
    }

    function saveFavoritesList(list) {
        localStorage.setItem('manga_prompt_favorites', JSON.stringify(list));
    }

    function saveToFavorites() {
        const subject = document.getElementById('subject_custom').value.trim();
        if (!subject) {
            alert("お気に入りに登録する前に、主人公や設定を入力してね！");
            return;
        }

        let displaySubject = subject.length > 12 ? subject.replace(/\n/g, ' ').substring(0, 12) + "..." : subject.replace(/\n/g, ' ');
        const favName = prompt("お気に入りのなまえをつけてね：", `★ ${displaySubject}`);
        
        if (!favName || !favName.trim()) return;

        const currentData = getCurrentState();
        let favs = getFavorites();

        favs.unshift({ id: Date.now(), title: favName.trim(), data: currentData });
        saveFavoritesList(favs);
        updateFavoriteCombo();
        alert(`「${favName}」をお気に入りに固定保存したよ！`);
    }

    function updateFavoriteCombo() {
        const select = document.getElementById('favoriteSelect');
        select.innerHTML = '<option value="">-- お気に入りを選ぶ --</option>';
        
        const favs = getFavorites();
        favs.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = f.title;
            select.appendChild(opt);
        });
    }

    function loadFavorite() {
        const id = document.getElementById('favoriteSelect').value;
        if (!id) return;

        const favs = getFavorites();
        const target = favs.find(f => f.id == id);
        if (!target) return;

        applyStateToUI(target.data);
        alert(`お気に入り「${target.title}」をよびだしたよ！`);
    }

    function deleteFavorite() {
        const id = document.getElementById('favoriteSelect').value;
        if (!id) return;

        const favs = getFavorites();
        const target = favs.find(f => f.id == id);
        if (!target) return;

        if (confirm(`お気に入り「${target.title}」を消してもいい？`)) {
            let updatedFavs = favs.filter(f => f.id != id);
            saveFavoritesList(updatedFavs);
            updateFavoriteCombo();
        }
    }

    function applyStateToUI(d) {
        document.getElementById('subject_custom').value = d.subject || '';
        document.getElementById('manga_style').value = d.style || '';
        document.getElementById('panel_layout').value = d.layout || '';
        document.getElementById('additional_notes').value = d.notes || '';
        document.getElementById('dialogues_text').value = d.dialogues || '';

        syncTagButtonsWithTextarea();
    }

    // --------------------------------------------------------
    // モーダル・クリップボード制御
    // --------------------------------------------------------
    function openModal() {
        document.getElementById('outputModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('outputModal').style.display = 'none';
    }
    function copyToClipboard() {
        const txt = document.getElementById('outputText').value;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt)
                .then(() => alert("クリップボードにコピーしたよ！ AIの画面に貼り付けてね！"))
                .catch(err => alert("コピーに失敗しちゃった: " + err));
        } else {
            const textArea = document.getElementById('outputText');
            textArea.select();
            document.execCommand('copy');
            alert("クリップボードにコピーしたよ！ AIの画面に貼り付けてね！");
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker 登録成功:', reg.scope))
                .catch(err => console.error('Service Worker 登録失敗:', err));
        });
    }
</script>
