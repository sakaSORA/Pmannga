<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>漫画プロンプトビルダー for 生成AI</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #1e1e1e;
            --container-bg: #2d2d2d;
            --accent-color: #4a90e2;
            --accent-active: #00ff66;
            --text-color: #f0f0f0;
            --border-color: #444444;
            --font-family:
                "HG丸ゴシックM-PRO",
                "HG Maru Gothic M-PRO",
                "Hiragino Maru Gothic ProN",
                "Yu Gothic",
                sans-serif;

            --font-size: 13pt;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.5;

            margin: 0;
            padding: 12px;

            overflow-x: hidden;

            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            background-color: var(--container-bg);

            padding: 16px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;

            font-size: 1.35rem;

            margin-top: 5px;
            margin-bottom: 20px;

            color: var(--accent-color);

            border-bottom: 2px solid var(--border-color);

            padding-bottom: 8px;
        }

        fieldset {
            border: 1px solid var(--border-color);

            border-radius: 8px;

            padding: 12px 15px;

            margin-bottom: 16px;

            background-color: rgba(255,255,255,0.02);

            min-width: 0;
            width: 100%;
        }

        legend {
            font-weight: bold;
            color: var(--accent-color);

            padding: 0 8px;

            font-size: 0.95rem;
        }

        .legend-with-action {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-input-btn {
            background-color: #7a3030;
            color: #fff;
            border: 1px solid #a94a4a;
            border-radius: 5px;
            padding: 4px 9px;
            font-family: var(--font-family);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-input-btn:active {
            background-color: #a13d3d;
        }

        .form-group {
            margin-bottom: 14px;

            display: flex;
            flex-direction: column;

            width: 100%;
        }

        label {
            margin-bottom: 6px;

            font-weight: bold;

            font-size: 0.9rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 100%;

            margin-bottom: 6px;
        }

        .label-row label {
            margin-bottom: 0;
        }

        select,
        textarea {
            background-color: #383838;

            border: 1px solid var(--border-color);

            color: var(--text-color);

            padding: 12px;

            border-radius: 6px;

            font-family: var(--font-family);
            font-size: 1rem;

            outline: none;

            width: 100%;

            appearance: none;
            -webkit-appearance: none;
        }

        select:focus,
        textarea:focus {
            border-color: var(--accent-color);

            background-color: #404040;
        }

        textarea {
            resize: vertical;
        }

        .tag-buttons {
            margin-bottom: 8px;

            display: flex;
            flex-direction: column;

            gap: 8px;

            width: 100%;
        }

        .tag-btn {
            background-color: #444;
            color: #fff;

            border: 1px solid var(--border-color);

            padding: 10px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-family: var(--font-family);
            font-size: 0.88rem;

            text-align: left;

            width: 100%;

            transition: all 0.2s ease;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag-btn.active {
            background-color: #1b4d3e;

            color: var(--accent-active);

            border-color: var(--accent-active);

            font-weight: bold;
        }

        .color-mode-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 8px;

            width: 100%;

            margin-top: 4px;
        }

        .color-btn {
            background-color: #444;
            color: #fff;

            border: 1px solid var(--border-color);

            height: 44px;

            border-radius: 6px;

            cursor: pointer;

            font-family: var(--font-family);
            font-size: 0.9rem;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            transition: all 0.2s ease;

            white-space: nowrap;
        }

        .color-btn.active {
            background-color: #1b4d3e;

            color: var(--accent-active);

            border-color: var(--accent-active);

            font-weight: bold;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mode-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid var(--border-color);
            min-height: 48px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.86rem;
            font-weight: bold;
            text-align: center;
        }

        .mode-btn.active {
            background-color: #1b4d3e;
            color: var(--accent-active);
            border-color: var(--accent-active);
        }

        .hint-text {
            color: #c8c8c8;
            font-size: 0.78rem;
            line-height: 1.45;
            margin-top: 6px;
        }

        .management-area {
            display: flex;
            flex-direction: column;

            gap: 12px;

            margin-bottom: 16px;

            background-color: #222;

            padding: 12px;

            border-radius: 8px;

            width: 100%;
        }

        .management-block {
            border-bottom: 1px solid #333;

            padding-bottom: 10px;
        }

        .management-block:last-child {
            border-bottom: none;

            padding-bottom: 0;
        }

        .management-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 8px;

            width: 100%;

            margin-top: 6px;
        }

        .management-controls button {
            width: 100%;

            height: 44px;

            padding: 4px 8px;

            font-size: 0.85rem;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            font-family: var(--font-family);

            white-space: nowrap;
        }

        .actions {
            margin-top: 20px;

            width: 100%;
        }

        button.main-btn {
            width: 100%;

            background-color: var(--accent-color);

            color: white;

            border: none;

            padding: 15px;

            font-size: 1.1rem;
            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            font-family: var(--font-family);

            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button.main-btn:active {
            filter: brightness(0.8);
        }

        button.sub-btn {
            background-color: #555;
            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        button.sub-btn:active {
            background-color: #666;
        }

        button.danger-btn {
            background-color: #962d2d;
        }

        button.danger-btn:active {
            background-color: #b33636;
        }

        .inline-insert-btn {
            background-color: #444;

            color: var(--accent-active);

            border: 1px solid var(--border-color);

            padding: 8px 4px;

            border-radius: 4px;

            font-size: 0.85rem;
            font-family: var(--font-family);
            font-weight: bold;

            cursor: pointer;

            transition: background-color 0.2s;

            flex: 1 1 calc(33.333% - 6px);
            min-width: 0;
            text-align: center;
            box-sizing: border-box;
        }

        .inline-insert-btn:active {
            background-color: #555;
        }

        .modal-overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.8);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 10px;
        }

        .modal-box {
            background-color: var(--container-bg);

            width: 100%;
            max-height: 95vh;

            padding: 16px;

            border-radius: 10px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.6);

            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;

            flex-shrink: 0;
        }

        .modal-title {
            font-weight: bold;

            font-size: 1.1rem;

            color: var(--accent-color);
        }

        .modal-body {
            flex-grow: 1;

            overflow-y: auto;

            margin-bottom: 12px;

            width: 100%;
        }

        .modal-body textarea {
            width: 100%;

            height: 60vh;

            background-color: #1e1e1e;

            color: #00ff66;

            font-family: Consolas, Monaco, var(--font-family);

            font-size: 0.9rem;

            padding: 10px;
        }

        .modal-footer {
            display: flex;

            gap: 10px;

            flex-shrink: 0;
        }

        .modal-footer button {
            flex: 1;

            padding: 12px;

            font-size: 1rem;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>漫画プロンプトビルダー for AI</h1>

    <div class="management-area">

        <div class="management-block">

            <div class="form-group" style="margin-bottom: 4px;">
                <label for="historySelect">自動保存データの再利用:</label>

                <select id="historySelect">
                    <option value="">-- 履歴表示 --</option>
                </select>
            </div>

            <div class="management-controls">

                <button
                    type="button"
                    class="sub-btn"
                    onclick="loadHistory()"
                >
                    適用・復元
                </button>

                <button
                    type="button"
                    class="sub-btn danger-btn"
                    onclick="deleteHistory()"
                >
                    履歴から消す
                </button>

            </div>

        </div>

        <div class="management-block" style="padding-top: 6px;">

            <div class="form-group" style="margin-bottom: 4px;">

                <label for="character名鑑Select">
                    👥 キャラクター選択（ボタンで決定）：
                </label>

                <select id="character名鑑Select">
                    <option value="">-- キャラクターを選択 --</option>
                </select>

            </div>

            <div class="management-controls">

                <button
                    type="button"
                    class="sub-btn"
                    style="background-color:#4a90e2;color:#fff;font-weight:bold;"
                    onclick="addSelectedCharacterToTextarea()"
                >
                    設定欄へ記入
                </button>

                <button
                    type="button"
                    class="sub-btn danger-btn"
                    onclick="deleteCharacterFromList()"
                >
                    選択キャラ削除
                </button>

            </div>

            <div
                class="management-controls"
                style="grid-template-columns:1fr;margin-top:6px;"
            >

                <button
                    type="button"
                    class="sub-btn"
                    style="background-color:#2b753a;color:#fff;font-weight:bold;"
                    onclick="addNewCharacter()"
                >
                    ✨ キャラクター新規登録
                </button>

            </div>

            <div
                class="management-controls"
                style="grid-template-columns:1fr 1fr;margin-top:6px;"
            >

                <button
                    type="button"
                    class="sub-btn"
                    style="background-color:#5a4a8a;color:#fff;font-weight:bold;"
                    onclick="exportCharacters()"
                >
                    📤 キャラクター外部保存
                </button>

                <button
                    type="button"
                    class="sub-btn"
                    style="background-color:#8a6a1a;color:#fff;font-weight:bold;"
                    onclick="document.getElementById('importFileInput').click()"
                >
                    📥 キャラクターの読込
                </button>

            </div>

            <input
                type="file"
                id="importFileInput"
                accept=".json"
                style="display:none;"
                onchange="importCharacters(event)"
            >

        </div>

    </div>

    <form id="promptForm" onsubmit="return false;">

        <fieldset>

            <legend>🎯 まず作りたいものを選ぶ</legend>

            <div class="quick-grid">

                <div class="form-group" style="margin-bottom:0;">
                    <label>出力タイプ：</label>

                    <div class="mode-grid">
                        <button
                            type="button"
                            class="mode-btn"
                            id="mode_assist"
                            onclick="selectOutputMode('assist')"
                        >
                            AIチャットで補完
                        </button>

                        <button
                            type="button"
                            class="mode-btn"
                            id="mode_direct"
                            onclick="selectOutputMode('direct')"
                        >
                            画像AIへ直接
                        </button>
                    </div>

                    <div class="hint-text" id="outputModeHint"></div>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                    <label for="visual_type">作りたい画像：</label>
                    <select id="visual_type"></select>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                    <label for="text_mode">画像内文字：</label>
                    <select id="text_mode"></select>
                    <div class="hint-text">
                        手軽さ優先なので「文字あり」が初期値です。崩れが気になる時だけ、文字スペースありに切り替えます。
                    </div>
                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>
                <span class="legend-with-action">
                    <span>★ 世界観・スタイルの設定</span>
                    <button
                        type="button"
                        class="clear-input-btn"
                        onclick="clearSubjectInput()"
                    >
                        入力クリア
                    </button>
                </span>
            </legend>

            <div class="form-group">

                <label for="subject_custom">
                    キャラクター設定（複数合流可能）：
                </label>

                <textarea
                    id="subject_custom"
                    rows="3"
                    placeholder="例：&#10;シズク（ジト目で大人しいダウナー系の少女）&#10;ビルダーくん（アプリの妖精。優しく教えてくれるマスコット）"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="manga_style">
                    作画スタイル（タッチ）：
                </label>

                <select id="manga_style"></select>

            </div>

        </fieldset>

        <fieldset>

            <legend>📖 構成・ページの組み立て</legend>

            <div class="form-group">

                <label for="panel_layout">
                    コマ数・コマ割り構成：
                </label>

                <select id="panel_layout"></select>

            </div>

            <div class="form-group">

                <label>出力カラーの選択：</label>

                <div class="color-mode-controls">

                    <button
                        type="button"
                        class="color-btn"
                        id="mode_color"
                        onclick="selectColorMode('color')"
                    >
                        🎨 フルカラー表示
                    </button>

                    <button
                        type="button"
                        class="color-btn"
                        id="mode_mono"
                        onclick="selectColorMode('mono')"
                    >
                        ⿊白（モノクロ原稿）
                    </button>

                </div>

            </div>

            <div class="form-group">

                <label for="additional_notes">
                    追加オプション（特殊効果・アスペクト比指定）：
                </label>

                <div class="tag-buttons">

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=" --ar 2:4"
                        onclick="toggleTagButton(this)"
                    >
                        📱 スマホ画面サイズ指定 [--ar 2:4]
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=" --ar 2:3"
                        onclick="toggleTagButton(this)"
                    >
                        📖 週刊誌サイズ指定 [--ar 2:3]
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=" --ar 3:2"
                        onclick="toggleTagButton(this)"
                    >
                        💻 よこ長画面サイズ指定 [--ar 3:2]
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", do not write character names or Japanese quotation marks inside speech bubbles"
                        onclick="toggleTagButton(this)"
                    >
                        ✨ ふきだし内「」キャラ名禁止
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", all speech bubble text written horizontally left-to-right, horizontal writing direction in all bubbles, vertical text in speech bubbles strictly forbidden"
                        onclick="toggleTagButton(this)"
                    >
                        ↔️ セリフ横書き固定
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", slanted panel borders, dynamic diagonal layout, dramatic panel compositions"
                        onclick="toggleTagButton(this)"
                    >
                        📐 大迫力のななめコマ
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", manga narration box, rectangular caption box with text in upper or lower panel area, storyteller caption frame"
                        onclick="toggleTagButton(this)"
                    >
                        📝 ナレーション枠
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", stylized comic book pop-art onomatopoeia, bold English action text SFX"
                        onclick="toggleTagButton(this)"
                    >
                        💥 英語の描き文字・効果音
                    </button>

                    <button
                        type="button"
                        class="tag-btn"
                        data-tag=", charming child hand-drawn speech bubbles, soft whimsical round dialogue frames"
                        onclick="toggleTagButton(this)"
                    >
                        💬 手書き風の丸型フキダシ
                    </button>

                </div>

                <textarea
                    id="additional_notes"
                    rows="2"
                    placeholder="特別なアングル指定など、こだわりたい指示があれば自由入力してください。"
                ></textarea>

            </div>

            <div class="form-group">

                <div class="label-row">
                    <label for="dialogues_text">
                        セリフや設定（改行入力）：
                    </label>
                    <button
                        type="button"
                        class="clear-input-btn"
                        onclick="clearDialoguesInput()"
                    >
                        入力クリア
                    </button>
                </div>

                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;">

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertBrackets()"
                    >
                        「」を入れる
                    </button>

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertTowrite('scene')"
                        title="場所、時間帯、雰囲気を指定します"
                    >
                        🌄 場所・時間
                    </button>

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertTowrite('action')"
                        title="誰が、何をして、どんな表情かを指定します"
                    >
                        🎬 動作・表情
                    </button>

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertTowrite('change')"
                        title="現在の場面から次の場面への切り替えを指定します"
                    >
                        ✂️ 場面転換
                    </button>

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertTowrite('bg')"
                        title="人物より背景や風景を大きく見せたいときに使います"
                    >
                        🖼️ 背景を見せる
                    </button>

                    <button
                        type="button"
                        class="inline-insert-btn"
                        onclick="insertTowrite('mono')"
                        title="キャラクターの口に出さない心の声を指定します"
                    >
                        💭 モノローグ
                    </button>

                </div>

                <div style="font-size:0.78rem;color:#c8c8c8;margin-bottom:6px;">
                    ボタンでひな形を挿入し、「○○」の部分だけを書き換えてください。不要な項目は削除できます。
                </div>

                <textarea
                    id="dialogues_text"
                    rows="6"
                    placeholder="夕暮れの校庭に立つ場面から&#10;「よしっ、いくぞ！」&#10;「うわっ！前がみえないぞ！？」&#10;「なんとかなるさ！」&#10;「大せいこう！」"
                ></textarea>

            </div>

        </fieldset>

        <div class="actions">

            <button
                type="button"
                class="main-btn"
                onclick="generatePrompt()"
            >
                プロンプトを生成する！
            </button>

        </div>

    </form>

</div>

<div class="modal-overlay" id="outputModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                生成完了：プロンプト
            </div>

            <button
                type="button"
                class="sub-btn"
                style="padding:6px 12px;"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div class="modal-body">

            <textarea id="outputText" readonly></textarea>

        </div>

        <div class="modal-footer">

            <button
                type="button"
                class="sub-btn"
                style="background-color:var(--accent-color);"
                onclick="copyToClipboard()"
            >
                プロンプトをコピー
            </button>

            <button
                type="button"
                class="sub-btn"
                onclick="closeModal()"
            >
                閉じる
            </button>

        </div>

    </div>

</div>

<script>

    // =========================================================
    // 安定性最優先ユーティリティ
    // =========================================================

    function safeLocalStorageSet(key, value) {
        try {
            const previous = localStorage.getItem(key);
            if (previous !== null) {
                localStorage.setItem(`${key}_backup`, previous);
            }
            localStorage.setItem(key, value);
            return true;
        } catch (e) {
            console.error('localStorage保存失敗', e);

            alert(
                '保存領域のエラーが発生しました。\n' +
                '不要な履歴を削除してください。'
            );

            return false;
        }
    }

    function safeLocalStorageGet(key, fallback = []) {
        try {
            const raw = localStorage.getItem(key);
            if (raw === null) return fallback;
            try {
                return JSON.parse(raw);
            } catch (primaryError) {
                const backup = localStorage.getItem(`${key}_backup`);
                if (backup !== null) {
                    const recovered = JSON.parse(backup);
                    localStorage.setItem(key, backup);
                    return recovered;
                }
                throw primaryError;
            }
        } catch (e) {
            console.error('localStorage取得失敗', e);
            return fallback;
        }
    }

    function getCharacters() {

        return value.filter(isValidCharacter);

    function isValidCharacter(character) {
        return character &&
            (typeof character.id === 'string' || typeof character.id === 'number') &&
            typeof character.name === 'string' &&
            character.name.trim() !== '' &&
            typeof character.details === 'string' &&
            character.details.trim() !== '';
    }

        chars.forEach(c => {

            opt.value = c.id;
            opt.textContent = c.name;

            select.appendChild(opt);

    function addNewCharacter() {

        const charName =
            prompt(
                "キャラクターの名前を入力してください（例：シズク）："
            );

        if (!charName || !charName.trim()) return;

        const charDetails =
            prompt(
                "キャラクターの特徴を入力してください（例：ジト目で大人しい少女、白髪）："
            );

        if (!charDetails || !charDetails.trim()) return;

        let chars = getCharacters();

        chars.unshift({

            id:
                (
                    crypto.randomUUID
                        ? crypto.randomUUID()
                        : String(Date.now()) + Math.random()
                ),

            name: charName.trim(),

            details: charDetails.trim()
        });

        saveCharactersList(chars);
    }

    function addSelectedCharacterToTextarea() {

        const select =
            document.getElementById('character名鑑Select');

        const id = select.value;

        if (!id) {

            alert(
                "設定欄に追加させたいキャラをリストからえらぶ。"
            );

            return;
        }

        const chars = getCharacters();

        const target = chars.find(c => c.id == id);

        if (!target) return;

        const textarea =
            document.getElementById('subject_custom');

        if (textarea.value.trim() !== "") {

            textarea.value +=
                `\n${target.name}（${target.details}）`;

        } else {

            textarea.value =
                `${target.name}（${target.details}）`;
        }

        select.value = "";
        scheduleDraftSave();
    }

    function deleteCharacterFromList() {

        const select =

        const id = select.value;

        if (!id) {

            alert(
                "消したいキャラクターを、上のリストからえらんでください。"
            );

            return;
        }

        let chars = getCharacters();

        const target = chars.find(c => c.id == id);

        if (!target) return;

        if (
            confirm(
                `キャラクター「${target.name}」を名鑑から消去しますか？`
            )
        ) {

            const updatedChars =
                chars.filter(c => c.id != id);

            saveCharactersList(updatedChars);

            select.value = "";
        }

    // =========================================================

    function exportCharacters() {

        const chars = getCharacters();

        if (chars.length === 0) {

            alert(
                "エクスポートできるキャラクターがありません。\n" +
                "まずキャラクターを登録してください。"
            );

            return;
        }

        const exportData = {
            appName: "漫画プロンプトビルダー",
            version: 1,
            exportedAt: new Date().toISOString(),
            characters: chars
        };

        const json =
            JSON.stringify(exportData, null, 2);

        const blob =
            new Blob([json], { type: "application/json" });

        const url = URL.createObjectURL(blob);

        const now = new Date();

        const dateStr =
            `${now.getFullYear()}` +
            `${String(now.getMonth()+1).padStart(2,'0')}` +
            `${String(now.getDate()).padStart(2,'0')}`;

        const a = document.createElement('a');

        a.href = url;
        a.download = `キャラクターBU_${dateStr}.json`;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        alert(
            `${chars.length}件のキャラクターデータを\n` +
            "JSONファイルとして保存しました。"
        );
    }

    function importCharacters(event) {

        const file = event.target.files[0];

        if (!file) return;

        // リセットしてから読み込む（同じファイルの再選択にも対応）
        event.target.value = "";

        const reader = new FileReader();

        reader.onload = (e) => {

            try {

                const parsed =
                    JSON.parse(e.target.result);

                // バリデーション
                if (
                    !parsed.characters ||
                    !Array.isArray(parsed.characters)
                ) {

                    alert(
                        "このファイルは対応フォーマットではありません。\n" +
                        "このアプリでキャラクターのJSONファイルを選んでください。"
                    );

                    return;
                }

                const incoming = parsed.characters
                    .filter(isValidCharacter)
                    .map(character => ({
                        id: String(character.id),
                        name: character.name.trim(),
                        details: character.details.trim()
                    }))
                    .filter((character, index, all) =>
                        all.findIndex(item => item.id === character.id) === index
                    );

                if (incoming.length === 0) {

                    alert(
                        "ファイル内にキャラクターデータが見つかりませんでした。"
                    );

                    return;
                }

                const existingChars = getCharacters();

                const choice = confirm(
                    `📥 インポート内容：${incoming.length}件のキャラクター\n\n` +
                    "【追加】現在のデータに追加しますか？\n" +
                    " →「OK」で追加（重複IDはスキップ）\n\n" +
                    "「キャンセル」を押すと、次に上書きするか確認します。"
                );

                if (choice) {

                    // 追加モード：重複IDはスキップ
                    const existingIds =
                        new Set(existingChars.map(c => String(c.id)));

                    const newChars =
                        incoming.filter(c => !existingIds.has(c.id));

                    const merged =
                        [...newChars, ...existingChars];

                    saveCharactersList(merged);

                    alert(
                        `✅ ${newChars.length}件のキャラクターを追加しました。\n` +
                        (
                            incoming.length - newChars.length > 0
                                ? `（${incoming.length - newChars.length}件は重複のためスキップ）`
                                : ""
                        )
                    );

                } else {

                    // 上書きモードの確認
                    const overwrite = confirm(
                        "⚠️ 現在の全キャラクターデータを削除して\n" +
                        "インポートデータで上書きしますか？\n\n" +
                        "上書きしない場合は「キャンセル」で取込を中止します。"
                    );

                    if (overwrite) {

                        saveCharactersList(incoming);

                        alert(
                            `✅ ${incoming.length}件のキャラクターデータで上書きしました。`
                        );
                    }
                }

            } catch (err) {

                console.error('インポートエラー', err);

                alert(
                    "ファイルの読み込みに失敗しました。\n" +
                    "正しいJSONファイルか確認してください。"
                );
            }
        };

        reader.onerror = () => {
            alert("ファイルを読み込めませんでした。");
        };

        reader.readAsText(file, 'UTF-8');
    }

    // =========================================================

    function toggleTagButton(btn) {

        const textarea =
            document.getElementById('additional_notes');

        const tagText =
            btn.getAttribute('data-tag');

        const isAspectRatio =
            /^ --ar \d+:\d+$/.test(tagText);

        if (isAspectRatio) {
            const wasActive =
                btn.classList.contains('active');

            document
                .querySelectorAll('.tag-buttons .tag-btn[data-tag^=" --ar "]')
                .forEach(aspectButton => {
                    const aspectTag =
                        aspectButton.getAttribute('data-tag');

                    aspectButton.classList.remove('active');

                    textarea.value =
                        textarea.value
                            .split(aspectTag)
                            .join('');
                });

            if (!wasActive) {
                btn.classList.add('active');
                textarea.value += tagText;
            }

            scheduleDraftSave();
            return;
        }

        if (btn.classList.contains('active')) {

            btn.classList.remove('active');

            textarea.value =
                textarea.value
                    .split(tagText)
                    .join('');

        } else {

            btn.classList.add('active');

            if (!textarea.value.includes(tagText)) {
                textarea.value += tagText;
            }
        }

        scheduleDraftSave();
    }

    function syncTagButtonsWithTextarea() {

        const textarea =
            document.getElementById('additional_notes');

        const text = textarea.value;

        document
            .querySelectorAll('.tag-buttons .tag-btn')
            .forEach(btn => {

                const tagText =
                    btn.getAttribute('data-tag');

                if (text.includes(tagText)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
    }

    document
        .getElementById('additional_notes')
        ?.addEventListener('input', () => {

            syncTagButtonsWithTextarea();
        });

    function getHistory() {
        const value = safeLocalStorageGet('manga_prompt_history', []);
        if (!Array.isArray(value)) return [];
        return value.filter(item =>
            item &&
            (typeof item.id === 'string' || typeof item.id === 'number') &&
            typeof item.title === 'string' &&
            item.data &&
            typeof item.data === 'object'
        );
    }

    function saveHistoryList(list) {

        safeLocalStorageSet(
            'manga_prompt_history',
            JSON.stringify(list.slice(0, 50))
        );
    }

    function autoSaveHistory(subjectStr) {

        const currentData = getCurrentState();

        let hist = getHistory();

        if (
            hist.length > 0 &&
            JSON.stringify(hist[0].data)
                === JSON.stringify(currentData)
        ) {
            return;
        }

        const now = new Date();

        const timestamp =
            `${now.getFullYear()}-` +
            `${String(now.getMonth()+1).padStart(2,'0')}-` +
            `${String(now.getDate()).padStart(2,'0')} ` +
            `${String(now.getHours()).padStart(2,'0')}:` +
            `${String(now.getMinutes()).padStart(2,'0')}:` +
            `${String(now.getSeconds()).padStart(2,'0')}`;

        let displaySubject =
            subjectStr.length > 12
                ? subjectStr.replace(/\n/g, ' ')
                    .substring(0, 12) + "..."
                : subjectStr.replace(/\n/g, ' ');

        const title =
            `${timestamp} - ${displaySubject}`;

        hist.unshift({

            id:
                (
                    crypto.randomUUID
                        ? crypto.randomUUID()
                        : String(Date.now()) + Math.random()
                ),

            title: title,

            data: currentData
        });

        saveHistoryList(hist);

        updateHistoryCombo();
    }

    function getCurrentState() {

        return {

            subject:
                document.getElementById('subject_custom').value,

            style:
                document.getElementById('manga_style').value,

            layout:
                document.getElementById('panel_layout').value,

            visualType:
                document.getElementById('visual_type').value,

            textMode:
                document.getElementById('text_mode').value,

            notes:
                document.getElementById('additional_notes').value,

            dialogues:
                document.getElementById('dialogues_text').value,

            outputMode:
                currentOutputMode,

            colorMode:
                currentColorMode
        };
    }

    function updateHistoryCombo() {

        const select =
            document.getElementById('historySelect');

        select.innerHTML =
            '<option value="">-- 履歴表示 --</option>';

        const hist = getHistory();

        hist.forEach(h => {

            const opt = document.createElement('option');

            opt.value = h.id;
            opt.textContent = h.title;

            select.appendChild(opt);
        });
    }

    function loadHistory() {

        const id =
            document.getElementById('historySelect').value;

        if (!id) return;

        const hist = getHistory();

        const target =
            hist.find(h => h.id == id);

        if (!target) return;

        applyStateToUI(target.data);
        saveDraft();
    }

    function deleteHistory() {

        const id =
            document.getElementById('historySelect').value;

        if (!id) return;

        if (confirm("選択した履歴を消去しますか？")) {

            let hist = getHistory();

            hist =
                hist.filter(h => h.id != id);

            saveHistoryList(hist);

            updateHistoryCombo();
        }
    }

    function applyStateToUI(d) {

        document.getElementById('subject_custom').value =
            d.subject || '';

        document.getElementById('manga_style').value =
            Object.prototype.hasOwnProperty.call(DATA_STYLE, d.style)
                ? d.style
                : Object.keys(DATA_STYLE)[0];

        document.getElementById('panel_layout').value =
            Object.prototype.hasOwnProperty.call(DATA_LAYOUT, d.layout)
                ? d.layout
                : "4コマ構成（縦並び・おすすめ！）";

        document.getElementById('visual_type').value =
            Object.prototype.hasOwnProperty.call(DATA_VISUAL_TYPE, d.visualType)
                ? d.visualType
                : "一枚絵・キービジュアル";

        document.getElementById('text_mode').value =
            Object.prototype.hasOwnProperty.call(DATA_TEXT_MODE, d.textMode)
                ? d.textMode
                : "文字あり（手軽・雰囲気重視）";

        document.getElementById('additional_notes').value =
            d.notes || '';

        document.getElementById('dialogues_text').value =
            d.dialogues || '';

        setOutputMode(d.outputMode || "assist");
        setColorMode(d.colorMode || "");

        syncTagButtonsWithTextarea();
    }

    // =========================================================
    // セリフ補助
    // =========================================================

    function insertBrackets() {

        const textarea =
            document.getElementById('dialogues_text');

        const currentText =
            textarea.value;

        if (currentText === "") {

            textarea.value = "「」";

        } else if (currentText.endsWith("\n")) {

            textarea.value =
                currentText + "「」";

        } else {

            textarea.value =
                currentText + "\n「」";
        }

        textarea.focus();

        const targetPos =
            textarea.value.length - 1;

        textarea.setSelectionRange(
            targetPos,
            targetPos
        );

        scheduleDraftSave();
    }

    // =========================================================
    // ト書き挿入
    // =========================================================

    function insertTowrite(type) {

        const textarea =
            document.getElementById('dialogues_text');

        const templates = {
            scene:  "【場所・時間】場所：○○／時間帯：○○／雰囲気：○○\n",
            action: "【動作・表情】キャラ名：○○／動作：○○／表情：○○\n",
            change: "【場面転換】○○の場面から、○○の場面へ切り替わる\n",
            bg:     "【背景を見せる】場所・風景：○○／特に見せたいもの：○○\n",
            mono:   "【心の声】キャラ名：○○／心の声：「○○」\n"
        };

        const text = templates[type] || "";
        const current = textarea.value;

        if (current === "" || current.endsWith("\n")) {
            textarea.value = current + text;
        } else {
            textarea.value = current + "\n" + text;
        }

        textarea.focus();
        textarea.setSelectionRange(
            textarea.value.length,
            textarea.value.length
        );

        scheduleDraftSave();
    }

    // =========================================================
    // プロンプト生成
    // =========================================================

    function getPromptParts() {

        const subject =
            document
                .getElementById('subject_custom')
                .value
                .trim();

        if (!subject) {
            alert("登場人物やキャラクター設定を入力してください。");
            return null;
        }

        const styleKey =
            document.getElementById('manga_style').value;

        const baseStyle =
            DATA_STYLE[styleKey] || styleKey;

        let style = "";

        if (currentColorMode === 'color') {
            style =
                "vibrant full color manga illustration, professionally colored, rich and beautiful color palette, " + baseStyle;
        } else if (currentColorMode === 'mono') {
            style =
                "monochrome black and white manga art, sharp ink lines, professional screentones, " + baseStyle;
        } else {
            style = baseStyle;
        }

        const layoutKey =
            document.getElementById('panel_layout').value;

        const visualKey =
            document.getElementById('visual_type').value;

        const textModeKey =
            document.getElementById('text_mode').value;

        const notes =
            document.getElementById('additional_notes').value.trim();

        const dialogues =
            document
                .getElementById('dialogues_text')
                .value
                .replace(/\r\n/g, '\n')
                .replace(/\r/g, '\n')
                .trim();

        return {
            subject,
            style,
            layoutKey,
            layout: DATA_LAYOUT[layoutKey] || layoutKey,
            visualKey,
            visual: DATA_VISUAL_TYPE[visualKey] || visualKey,
            textModeKey,
            textMode: DATA_TEXT_MODE[textModeKey] || textModeKey,
            notes,
            dialogues
        };
    }

    function buildCompositionLine(parts) {

        const isComic =
            parts.visualKey.includes('4コマ') ||
            parts.visualKey.includes('漫画ページ');

        if (isComic) {
            return parts.layout;
        }

        return (
            parts.visual + ". " +
            "Create one complete image instead of separate panels. " +
            "Use a strong foreground, middle ground, and background, with a clear focal point."
        );
    }

    function buildDirectPrompt(parts) {

        let p = "";

        p += parts.visual + ", ";
        p += parts.style + ". ";
        p += "Main characters and fixed setting: " + parts.subject + ". ";
        p += "Composition: " + buildCompositionLine(parts) + " ";
        p += "Text treatment: " + parts.textMode + " ";
        p +=
            "Creatively fill in suitable background details, lighting, camera angle, emotional atmosphere, symbolic motifs, color design, and small visual storytelling elements while preserving the character identities and core idea. ";

        if (parts.dialogues) {
            p +=
                "Story, scene notes, title ideas, dialogue, or captions to include or reflect: " +
                parts.dialogues + " ";
        }

        if (parts.notes) {
            p += "Additional user notes: " + parts.notes + " ";
        }

        p +=
            "High quality manga illustration, appealing composition, detailed but readable, finished artwork.";

        return p;
    }

    function buildAssistPrompt(parts) {

        let p = "";

        p += "以下の素材をもとに、画像生成AIへそのまま貼れる英語プロンプトを1つ作ってください。\n";
        p += "不足している背景、光、構図、感情演出、象徴モチーフ、配色は自然に補完してください。\n";
        p += "キャラクターの同一性、主題、入力された日本語のセリフやタイトル案は変えないでください。\n";
        p += "説明や候補リストではなく、完成したプロンプト本文だけを出してください。\n\n";

        p += "【作りたい画像】\n";
        p += parts.visualKey + "\n\n";

        p += "【画像内文字】\n";
        p += parts.textModeKey + "\n";
        p += parts.textMode + "\n\n";

        p += "【キャラクター・主題】\n";
        p += parts.subject + "\n\n";

        p += "【画風】\n";
        p += parts.style + "\n\n";

        p += "【構図・ページ構成】\n";
        p += buildCompositionLine(parts) + "\n\n";

        if (parts.dialogues) {
            p += "【入れたいセリフ・タイトル案・場面メモ】\n";
            p += parts.dialogues + "\n\n";
        }

        if (parts.notes) {
            p += "【追加メモ】\n";
            p += parts.notes + "\n\n";
        }

        p += "【仕上げの方向性】\n";
        p += "手軽に見栄えのする、完成度の高い漫画・アニメ調ビジュアルにしてください。";

        return p;
    }

    function generatePrompt() {

        const parts = getPromptParts();
        if (!parts) return;

        const prompt =
            currentOutputMode === "direct"
                ? buildDirectPrompt(parts)
                : buildAssistPrompt(parts);

        document.getElementById('outputText').value = prompt;

        openModal();

        autoSaveHistory(parts.subject);
        saveDraft();
    }

    // =========================================================
    // モーダル
    // =========================================================

    function openModal() {

        document.getElementById('outputModal').style.display =
            'flex';
    }

    function closeModal() {

        document.getElementById('outputModal').style.display =
            'none';
    }

    // =========================================================
    // コピー
    // =========================================================

    async function copyToClipboard() {

        const txt =
            document.getElementById('outputText').value;

        try {

            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {

                await navigator.clipboard.writeText(txt);

            } else {

                const textArea =
                    document.getElementById('outputText');

                textArea.select();

                const ok =
                    document.execCommand('copy');

                if (!ok) {
                    throw new Error('execCommand失敗');
                }
            }

            alert(
                "指示書をクリップボードにコピーしました。\n" +
                "AIのチャット欄に貼り付けて送信してください。"
            );

        } catch (err) {

            console.error(err);

            alert(
                "コピーに失敗しました。"
            );
        }
    }

    // =========================================================
    // Service Worker
    // =========================================================

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.warn('Service Worker 登録失敗', err);
            });
        });
    }

</script>
