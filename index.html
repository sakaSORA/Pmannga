<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Manga Retouch Mobile</title>

<style>
:root{
    --panel:#1d1d1d;
    --accent:#007aff;
    --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    flex-direction:column;
}

#viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    background:#111;
}

#canvas-wrap{
    position:absolute;
    top:0;
    left:0;
    transform-origin:top left;
    touch-action:none;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

#temp{
    pointer-events:none;
}

.bottom-bar{
    height:74px;
    background:var(--panel);
    border-top:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding-bottom:var(--safe-bottom);
    z-index:1000;
}

.tool-btn{
    width:54px;
    height:54px;
    border:none;
    background:none;
    color:#aaa;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:24px;
    gap:3px;
}

.tool-btn.active{
    background:#333;
    color:#fff;
}

.tool-label{
    font-size:10px;
}

.panel{
    position:absolute;
    left:0;
    bottom:74px;
    width:100%;
    background:rgba(25,25,25,.96);
    backdrop-filter:blur(10px);
    border-top:1px solid #333;
    padding:14px;
    z-index:2000;
    display:none;
}

.panel.show{
    display:block;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.group{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
}

label{
    font-size:12px;
    color:#aaa;
}

textarea,
select{
    width:100%;
    background:#333;
    color:#fff;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
    font-size:16px;
}

textarea{
    resize:none;
    min-height:120px;
}

input[type="range"]{
    width:100%;
}

.action-btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.primary{
    background:var(--accent);
}

.secondary{
    background:#444;
}

.top-ui{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:3000;
}

.top-btn{
    border:none;
    border-radius:10px;
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:10px 14px;
    font-size:13px;
}

#size-preview{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0;
    transition:.2s;
    z-index:5000;
}

#size-circle{
    border-radius:50%;
    background:#fff;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<div id="viewport">

    <div class="top-ui">

        <button class="top-btn"
        onclick="fitCanvas()">
            Fit
        </button>

        <button class="top-btn"
        onclick="openImage()">
            読込
        </button>

        <button class="top-btn"
        onclick="saveImage()">
            保存
        </button>

    </div>

    <div id="canvas-wrap">

        <canvas id="main"></canvas>
        <canvas id="temp"></canvas>

    </div>

    <div id="size-preview">
        <div id="size-circle"></div>
    </div>

    <!-- Pen Panel -->
    <div class="panel show"
    id="pen-panel">

        <div class="row">

            <div class="group">

                <label>太さ</label>

                <input type="range"
                id="pen-size"
                min="1"
                max="100"
                value="18">

            </div>

            <div class="group">

                <label>描画</label>

                <select id="pen-type">
                    <option value="normal">通常</option>
                    <option value="blur">なじませ</option>
                </select>

            </div>

        </div>

    </div>

    <!-- Text Panel -->
    <div class="panel"
    id="text-panel">

        <div class="row">

            <div class="group">

                <label>テキスト</label>

                <textarea id="text-input">こんにちは
縦書き対応です</textarea>

            </div>

        </div>

        <div class="row">

            <div class="group">

                <label>方向</label>

                <select id="text-direction">
                    <option value="horizontal">横書き</option>
                    <option value="vertical">縦書き</option>
                </select>

            </div>

            <div class="group">

                <label>フォント</label>

                <select id="font-family">
                    <option value="sans-serif">ゴシック</option>
                    <option value="serif">明朝</option>
                    <option value="cursive">手書き</option>
                </select>

            </div>

        </div>

        <div class="row">

            <div class="group">

                <label>サイズ</label>

                <input type="range"
                id="text-size"
                min="0.5"
                max="10"
                step="0.1"
                value="2">

            </div>

            <div class="group">

                <label>文字色</label>

                <select id="text-color">
                    <option value="#ffffff">白</option>
                    <option value="#000000">黒</option>
                    <option value="#ff0000">赤</option>
                </select>

            </div>

        </div>

        <div class="row">

            <button class="action-btn secondary"
            onclick="cancelText()">
                中止
            </button>

            <button class="action-btn primary"
            onclick="applyText()">
                配置確定
            </button>

        </div>

    </div>

</div>

<!-- Bottom Bar -->
<div class="bottom-bar">

    <button class="tool-btn active"
    id="btn-pen"
    onclick="setMode('pen')">

        ✏️
        <div class="tool-label">線</div>

    </button>

    <button class="tool-btn"
    onclick="setColor('#ffffff')">

        ⚪
        <div class="tool-label">白</div>

    </button>

    <button class="tool-btn"
    onclick="setColor('#000000')">

        ⚫
        <div class="tool-label">黒</div>

    </button>

    <button class="tool-btn"
    id="btn-text"
    onclick="startTextMode()">

        Ｔ
        <div class="tool-label">文字</div>

    </button>

    <button class="tool-btn"
    onclick="undo()">

        ↶
        <div class="tool-label">Undo</div>

    </button>

    <button class="tool-btn"
    onclick="redo()">

        ↷
        <div class="tool-label">Redo</div>

    </button>

</div>

<input type="file"
id="file-input"
accept="image/*"
class="hidden">

<script>
const main = document.getElementById('main');
const temp = document.getElementById('temp');

const mctx = main.getContext('2d');
const tctx = temp.getContext('2d');

const wrap = document.getElementById('canvas-wrap');
const viewport = document.getElementById('viewport');

let imgW = 1080;
let imgH = 1920;

main.width = imgW;
main.height = imgH;

temp.width = imgW;
temp.height = imgH;

wrap.style.width = imgW + 'px';
wrap.style.height = imgH + 'px';

mctx.fillStyle = "#ffffff";
mctx.fillRect(0,0,imgW,imgH);

let mode = "pen";

let currentColor = "#ffffff";

let scale = 0.4;
let panX = 0;
let panY = 0;

let drawing = false;

let prevX = 0;
let prevY = 0;

let activePointers = new Map();

let history = [];
let redoStack = [];

let textX = imgW / 2;
let textY = imgH / 2;

function fitCanvas(){

    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;

    scale = Math.min(
        (vw - 20) / imgW,
        (vh - 20) / imgH
    );

    panX = (vw - imgW * scale) / 2;
    panY = (vh - imgH * scale) / 2;

    updateTransform();
}

function updateTransform(){

    wrap.style.transform =
    `translate(${panX}px,${panY}px) scale(${scale})`;
}

fitCanvas();

function saveHistory(){

    history.push(
        mctx.getImageData(0,0,imgW,imgH)
    );

    if(history.length > 30){

        history.shift();
    }

    redoStack = [];
}

saveHistory();

function undo(){

    if(history.length <= 1) return;

    redoStack.push(history.pop());

    mctx.putImageData(
        history[history.length - 1],
        0,
        0
    );
}

function redo(){

    if(redoStack.length === 0) return;

    const data = redoStack.pop();

    history.push(data);

    mctx.putImageData(data,0,0);
}

function setMode(m){

    mode = m;

    document.querySelectorAll('.tool-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });

    if(m === "pen"){

        document.getElementById('btn-pen')
        .classList.add('active');
    }

    hidePanels();

    if(m === "pen"){

        showPanel('pen-panel');
    }
}

function setColor(color){

    currentColor = color;
}

function showPanel(id){

    document.getElementById(id)
    .classList.add('show');
}

function hidePanels(){

    document.querySelectorAll('.panel')
    .forEach(panel=>{
        panel.classList.remove('show');
    });
}

function getPos(e){

    const rect = wrap.getBoundingClientRect();

    return{

        x:(e.clientX - rect.left)
        * (imgW / rect.width),

        y:(e.clientY - rect.top)
        * (imgH / rect.height)
    };
}

function setupPen(ctx){

    ctx.lineWidth =
    document.getElementById('pen-size').value;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.strokeStyle = currentColor;
}

wrap.addEventListener('pointerdown',e=>{

    activePointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    if(activePointers.size >= 2){

        return;
    }

    const p = getPos(e);

    prevX = p.x;
    prevY = p.y;

    if(mode === "pen"){

        drawing = true;

    }else if(mode === "text-edit"){

        drawing = true;
    }
});

wrap.addEventListener('pointermove',e=>{

    if(!activePointers.has(e.pointerId)) return;

    const old =
    activePointers.get(e.pointerId);

    const dx = e.clientX - old.x;
    const dy = e.clientY - old.y;

    activePointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    // 2 finger zoom/pan
    if(activePointers.size >= 2){

        const pts =
        Array.from(activePointers.values());

        const p1 = pts[0];
        const p2 = pts[1];

        const dist =
        Math.hypot(
            p2.x - p1.x,
            p2.y - p1.y
        );

        if(!window.lastDist){

            window.lastDist = dist;
        }

        scale *= dist / window.lastDist;

        scale = Math.max(
            .1,
            Math.min(scale,8)
        );

        window.lastDist = dist;

        panX += dx;
        panY += dy;

        updateTransform();

        return;
    }

    if(!drawing) return;

    const p = getPos(e);

    // text move
    if(mode === "text-edit"){

        textX += p.x - prevX;
        textY += p.y - prevY;

        renderTextPreview();

        prevX = p.x;
        prevY = p.y;

        return;
    }

    // pen
    if(mode === "pen"){

        const type =
        document.getElementById('pen-type').value;

        if(type === "blur"){

            const size =
            parseInt(
                document.getElementById('pen-size').value
            );

            // 最適値
            const blurSize = size * 1.6;

            mctx.globalAlpha = .28;

            mctx.drawImage(
                main,

                p.x - blurSize / 2,
                p.y - blurSize / 2,
                blurSize,
                blurSize,

                p.x - size / 2,
                p.y - size / 2,
                size,
                size
            );

            mctx.globalAlpha = 1;

        }else{

            setupPen(mctx);

            mctx.beginPath();

            mctx.moveTo(prevX,prevY);
            mctx.lineTo(p.x,p.y);

            mctx.stroke();
        }
    }

    prevX = p.x;
    prevY = p.y;
});

wrap.addEventListener('pointerup',()=>{

    activePointers.clear();

    window.lastDist = null;

    if(drawing){

        drawing = false;

        saveHistory();
    }
});

function startTextMode(){

    mode = "text-edit";

    document.querySelectorAll('.tool-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });

    document.getElementById('btn-text')
    .classList.add('active');

    hidePanels();

    showPanel('text-panel');

    textX = imgW / 2;
    textY = imgH / 2;

    renderTextPreview();
}

function drawText(ctx){

    const txt =
    document.getElementById('text-input').value;

    const direction =
    document.getElementById('text-direction').value;

    const font =
    document.getElementById('font-family').value;

    const color =
    document.getElementById('text-color').value;

    const textScale =
    parseFloat(
        document.getElementById('text-size').value
    );

    const size = 20 * textScale;

    ctx.save();

    ctx.font =
    `bold ${size}px ${font}`;

    ctx.fillStyle = color;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const lines = txt.split('\n');

    const lineHeight = size * 1.2;

    // horizontal
    if(direction === "horizontal"){

        lines.forEach((line,index)=>{

            ctx.fillText(
                line,
                textX,
                textY +
                (index - (lines.length - 1)/2)
                * lineHeight
            );
        });

    }else{

        // vertical right to left

        lines.forEach((line,lineIndex)=>{

            const chars =
            Array.from(line);

            chars.forEach((char,charIndex)=>{

                let x =
                textX -
                (lineIndex -
                (lines.length - 1)/2)
                * lineHeight;

                let y =
                textY +
                charIndex * lineHeight;

                if("、。,.」』】".includes(char)){

                    x += size * .25;
                    y -= size * .15;
                }

                ctx.save();

                if("ー".includes(char)){

                    ctx.translate(x,y);

                    ctx.rotate(Math.PI / 2);

                    ctx.fillText(char,0,0);

                }else{

                    ctx.fillText(char,x,y);
                }

                ctx.restore();
            });
        });
    }

    ctx.restore();
}

function renderTextPreview(){

    tctx.clearRect(0,0,imgW,imgH);

    drawText(tctx);
}

function applyText(){

    drawText(mctx);

    tctx.clearRect(0,0,imgW,imgH);

    saveHistory();

    setMode('pen');
}

function cancelText(){

    tctx.clearRect(0,0,imgW,imgH);

    setMode('pen');
}

document.getElementById('text-input')
.oninput = renderTextPreview;

document.getElementById('text-direction')
.onchange = renderTextPreview;

document.getElementById('font-family')
.onchange = renderTextPreview;

document.getElementById('text-size')
.oninput = renderTextPreview;

document.getElementById('text-color')
.onchange = renderTextPreview;

function openImage(){

    document.getElementById('file-input')
    .click();
}

document.getElementById('file-input')
.onchange = e=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = ev=>{

        const img = new Image();

        img.onload = ()=>{

            imgW = img.width;
            imgH = img.height;

            main.width = imgW;
            main.height = imgH;

            temp.width = imgW;
            temp.height = imgH;

            wrap.style.width =
            imgW + 'px';

            wrap.style.height =
            imgH + 'px';

            mctx.clearRect(0,0,imgW,imgH);

            mctx.drawImage(img,0,0);

            fitCanvas();

            history = [];
            redoStack = [];

            saveHistory();
        };

        img.src = ev.target.result;
    };

    reader.readAsDataURL(file);
};

function saveImage(){

    main.toBlob(blob=>{

        const url =
        URL.createObjectURL(blob);

        const a =
        document.createElement('a');

        a.href = url;
        a.download = 'edited_image.jpg';

        a.click();

        URL.revokeObjectURL(url);

    },'image/jpeg',0.95);
}

document.getElementById('pen-size')
.oninput = e=>{

    const size =
    parseInt(e.target.value);

    const preview =
    document.getElementById('size-preview');

    const circle =
    document.getElementById('size-circle');

    circle.style.width =
    size * scale + 'px';

    circle.style.height =
    size * scale + 'px';

    circle.style.background =
    currentColor;

    preview.style.opacity = 1;

    clearTimeout(window.previewTimer);

    window.previewTimer =
    setTimeout(()=>{

        preview.style.opacity = 0;

    },600);
};
</script>

</body>
</html>
